<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>AuraChat</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<div id="login" class="overlay hidden">
  <form class="login-card" id="loginForm">
    <div class="logo">✦</div>
    <h1>AuraChat</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<div id="app">
  <div id="scrim" class="scrim hidden"></div>
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="logo-s">✦</span> AuraChat</div>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="Close">✕</button>
    </div>
    <button class="btn new" id="newChat">＋ New chat</button>
    <div class="side-label">Recents</div>
    <div id="convList" class="conv-list"></div>
    <div class="side-bottom">
      <button class="btn ghost" id="openSettings">⚙ Settings</button>
    </div>
  </aside>

  <main id="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="openSide" aria-label="Menu">☰</button>
      <div id="chatTitle" class="chat-title"></div>
    </header>

    <div id="scroll" class="scroll">
      <div id="empty" class="empty">
        <div class="logo big">✦</div>
        <h2 id="greeting">How can I help you today?</h2>
      </div>
      <div id="messages" class="messages"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div id="attStrip" class="att-strip hidden"></div>
        <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="composer-row">
          <div class="row">
            <button class="tool-btn" id="attachBtn" title="Attach images">📎</button>
            <button class="tool-btn" id="optBtn" title="Thinking, search, style"><span id="optLabel">⚙ Options</span></button>
            <input type="file" id="fileIn" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          </div>
          <div class="row" style="min-width:0">
            <button class="model-btn" id="modelBtn" title="Choose model"><span id="modelName">Model</span> ▾</button>
            <button class="send" id="sendBtn" aria-label="Send">↑</button>
          </div>
        </div>
      </div>
      <div class="hint">AI can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<div id="modal" class="overlay hidden"><div class="modal" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>

</body>
</html>
